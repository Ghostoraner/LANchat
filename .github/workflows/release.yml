name: "Release App"

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App (.exe & .msi)
        run: |
          cd lanchat-tauri
          npm install
          npm run tauri build

      - name: Upload Windows Executables
        uses: softprops/action-gh-release@v1
        with:
          files: |
            lanchat-tauri/src-tauri/target/release/bundle/msi/*.msi
            lanchat-tauri/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}